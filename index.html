<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>VDC360° — Reporte Clientes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --brand:#0a7a3b;
      --bg:#f6f7f8;
      --card:#fff;
      --line:#e5e7eb;
      --ink:#111827;
      --muted:#64748b;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:Arial, Helvetica, sans-serif;
    }

    header{
      background:var(--brand);
      color:#fff;
      padding:16px;
    }

    header h1{
      margin:0;
      font-size:20px;
    }

    main{
      max-width:1300px;
      margin:auto;
      padding:16px;
      display:grid;
      gap:16px;
    }

    .card{
      background:var(--card);
      border-radius:14px;
      padding:16px;
      box-shadow:0 6px 20px rgba(0,0,0,.08);
    }

    h2{
      margin:0 0 12px;
      font-size:18px;
    }

    label{
      display:block;
      font-weight:700;
      font-size:13px;
      margin-bottom:6px;
    }

    input,select,button{
      width:100%;
      padding:10px;
      border:1px solid var(--line);
      border-radius:10px;
      font-size:14px;
      background:#fff;
    }

    button{
      cursor:pointer;
      font-weight:800;
    }

    .btn-primary{
      background:var(--brand);
      color:#fff;
      border:none;
    }

    .btn-ghost{
      background:#fff;
      color:#111;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr 1fr 1fr auto;
      gap:10px;
      align-items:end;
    }

    .tabs{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .tab{
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      cursor:pointer;
      font-weight:800;
    }

    .tab.active{
      background:var(--brand);
      color:#fff;
      border-color:var(--brand);
    }

    .section{
      display:none;
    }

    .section.active{
      display:block;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
      background:#fff;
    }

    th{
      background:var(--brand);
      color:#fff;
      padding:9px;
      text-align:left;
      font-size:13px;
    }

    td{
      padding:8px;
      border-bottom:1px solid var(--line);
      font-size:13px;
    }

    .right{text-align:right}
    .muted{color:var(--muted);font-size:13px}

    .pill{
      display:inline-block;
      padding:5px 10px;
      border-radius:999px;
      background:#eef7f0;
      color:var(--brand);
      font-weight:800;
      font-size:13px;
    }

    .filterBox{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-bottom:12px;
    }

    .totalBox{
      background:#eef7f0;
      border:1px solid #cde7d4;
      border-radius:12px;
      padding:14px;
      font-weight:900;
      color:var(--brand);
      font-size:18px;
    }

    .cardsGrid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
    }

    .clientCard{
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
      background:#fff;
      break-inside:avoid;
    }

    .clientTitle{
      background:var(--brand);
      color:#fff;
      font-weight:900;
      text-align:center;
      padding:10px;
    }

    .clientTotal{
      background:#eef7f0;
      color:var(--brand);
      font-weight:900;
      padding:10px;
      text-align:right;
    }

    .loading{
      display:none;
      font-weight:900;
      color:var(--brand);
    }

    .loading.on{display:block}

    @media(max-width:900px){
      .grid{grid-template-columns:1fr}
      .cardsGrid{grid-template-columns:1fr}
      .filterBox{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

<header>
  <h1>VDC360° — Reporte General de Clientes</h1>
</header>

<main>

  <section class="card">
    <h2>🔎 Parámetros del reporte</h2>

    <div class="grid">
      <div>
        <label>Desde</label>
        <input id="fechaDesde" type="date">
      </div>

      <div>
        <label>Hasta</label>
        <input id="fechaHasta" type="date">
      </div>

      <div>
        <label>Producto</label>
        <select id="productoSelect">
          <option value="">Todos los productos</option>
        </select>
      </div>

      <div>
        <label>Acción</label>
        <button class="btn-primary" id="btnGenerar">
          Generar reporte
        </button>
      </div>

      <div>
        <label>&nbsp;</label>
        <button class="btn-ghost" id="btnCSV">
          Descargar CSV
        </button>
      </div>
    </div>

    <p class="loading" id="loading">Cargando reporte...</p>
  </section>

  <section class="card">
    <div class="tabs">
      <button class="tab active" data-tab="general">Resumen General</button>
      <button class="tab" data-tab="filtrado">Filtrado</button>
      <button class="tab" data-tab="clientes">Clientes Resumen OK</button>
    </div>
  </section>

  <section class="card section active" id="tab-general">
    <h2>📋 Resumen General</h2>
    <span class="pill" id="resumenGeneralInfo">Sin datos</span>

    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Fecha</th>
          <th class="right">Kilos</th>
        </tr>
      </thead>
      <tbody id="generalBody"></tbody>
    </table>
  </section>

  <section class="card section" id="tab-filtrado">
    <h2>🔎 Filtrado por cliente</h2>

    <div class="filterBox">
      <div>
        <label>Cliente</label>
        <select id="clienteFiltro">
          <option value="">Selecciona cliente</option>
        </select>
      </div>

      <div>
        <label>Total kilos filtrados</label>
        <div class="totalBox" id="totalFiltrado">0.00 kg</div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Fecha</th>
          <th class="right">Kilos</th>
        </tr>
      </thead>
      <tbody id="filtradoBody"></tbody>
    </table>
  </section>

  <section class="card section" id="tab-clientes">
    <h2>🧾 Clientes Resumen OK</h2>
    <div class="cardsGrid" id="clientesCards"></div>
  </section>

</main>

<script>
  const SUPABASE_URL = "https://bjebybdqcqscouxlinfd.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqZWJ5YmRxY3FzY291eGxpbmZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYzMjQ3MTksImV4cCI6MjA3MTkwMDcxOX0.mQgWtiYEyJTiF04pdcLv63SqPNrU1Iehws0vKqr82O0";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let REPORTE = [];

  const $ = s => document.querySelector(s);
  const to2 = n => Number(n || 0).toFixed(2);

  function todayISO(){
    const d = new Date();
    const z = d.getTimezoneOffset() * 60000;
    return new Date(d - z).toISOString().slice(0,10);
  }

  function monthStartISO(){
    const d = new Date();
    const z = d.getTimezoneOffset() * 60000;
    const inicio = new Date(d.getFullYear(), d.getMonth(), 1);
    return new Date(inicio - z).toISOString().slice(0,10);
  }

  function productoBonito(s){
    const limpio = String(s || "").trim().toLowerCase().replace(/\s+/g," ");
    if(!limpio) return "";
    return limpio.charAt(0).toUpperCase() + limpio.slice(1);
  }

  function normalizeKey(s){
    return String(s || "")
      .trim()
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/\s+/g," ");
  }

  async function cargarProductos(){
    const { data, error } = await sb
      .from("productos")
      .select("nombre")
      .order("nombre");

    if(error){
      console.error(error);
      return;
    }

    const select = $("#productoSelect");

    (data || []).forEach(p=>{
      const opt = document.createElement("option");
      opt.value = p.nombre;
      opt.textContent = productoBonito(p.nombre);
      select.appendChild(opt);
    });
  }

  async function generarReporte(){
    const desde = $("#fechaDesde").value;
    const hasta = $("#fechaHasta").value;
    const producto = $("#productoSelect").value;

    if(!desde || !hasta){
      alert("Selecciona fecha desde y hasta");
      return;
    }

    $("#loading").classList.add("on");

    try{
      const { data:notas, error:notasError } = await sb
        .from("notas_credito")
        .select("id, fecha, clientes(nombre)")
        .gte("fecha", desde)
        .lte("fecha", hasta);

      if(notasError) throw notasError;

      const ids = (notas || []).map(n => n.id);

      if(!ids.length){
        REPORTE = [];
        renderAll();
        alert("No hay notas en ese periodo");
        return;
      }

      let query = sb
        .from("notas_detalle")
        .select("nota_id, producto, cantidad, piezas")
        .in("nota_id", ids);

      if(producto){
        query = query.eq("producto", producto);
      }

      const { data:detalles, error:detError } = await query;

      if(detError) throw detError;

      const mapa = new Map();

      (detalles || []).forEach(d=>{
        const nota = notas.find(n => n.id === d.nota_id);
        if(!nota) return;

        const nombre = productoBonito(nota.clientes?.nombre || "Sin cliente");
        const fecha = nota.fecha;
        const kilos = Number(d.cantidad || 0);

        const key = `${normalizeKey(nombre)}|${fecha}`;

        if(!mapa.has(key)){
          mapa.set(key, {
            nombre,
            fecha,
            kilos:0
          });
        }

        mapa.get(key).kilos += kilos;
      });

      REPORTE = Array.from(mapa.values())
        .map(r=>({
          nombre:r.nombre,
          fecha:r.fecha,
          kilos:Number(to2(r.kilos))
        }))
        .sort((a,b)=>{
          const n = a.nombre.localeCompare(b.nombre, "es");
          if(n !== 0) return n;
          return a.fecha.localeCompare(b.fecha);
        });

      renderAll();

    }catch(err){
      console.error(err);
      alert("Error generando reporte. Revisa consola o conexión Supabase.");
    }finally{
      $("#loading").classList.remove("on");
    }
  }

  function renderAll(){
    renderGeneral();
    renderClientesSelect();
    renderFiltrado();
    renderCards();
  }

  function renderGeneral(){
    const totalKg = REPORTE.reduce((a,b)=>a + Number(b.kilos || 0),0);

    $("#resumenGeneralInfo").textContent =
      `Registros: ${REPORTE.length} · Total kilos: ${to2(totalKg)} kg`;

    $("#generalBody").innerHTML = REPORTE.map(r=>`
      <tr>
        <td>${r.nombre}</td>
        <td>${r.fecha}</td>
        <td class="right">${to2(r.kilos)}</td>
      </tr>
    `).join("");
  }

  function renderClientesSelect(){
    const clientes = [...new Set(REPORTE.map(r=>r.nombre))]
      .sort((a,b)=>a.localeCompare(b,"es"));

    const actual = $("#clienteFiltro").value;

    $("#clienteFiltro").innerHTML =
      `<option value="">Selecciona cliente</option>` +
      clientes.map(c=>`<option value="${c}">${c}</option>`).join("");

    if(clientes.includes(actual)){
      $("#clienteFiltro").value = actual;
    }
  }

  function renderFiltrado(){
    const cliente = $("#clienteFiltro").value;

    const rows = cliente
      ? REPORTE.filter(r => r.nombre === cliente)
      : [];

    const total = rows.reduce((a,b)=>a + Number(b.kilos || 0),0);

    $("#totalFiltrado").textContent = `${to2(total)} kg`;

    $("#filtradoBody").innerHTML = rows.map(r=>`
      <tr>
        <td>${r.nombre}</td>
        <td>${r.fecha}</td>
        <td class="right">${to2(r.kilos)}</td>
      </tr>
    `).join("");
  }

  function renderCards(){
    const grupos = {};

    REPORTE.forEach(r=>{
      if(!grupos[r.nombre]){
        grupos[r.nombre] = [];
      }

      grupos[r.nombre].push(r);
    });

    $("#clientesCards").innerHTML = Object.entries(grupos)
      .sort((a,b)=>a[0].localeCompare(b[0],"es"))
      .map(([cliente, rows])=>{
        const total = rows.reduce((a,b)=>a + Number(b.kilos || 0),0);

        return `
          <div class="clientCard">
            <div class="clientTitle">${cliente}</div>

            <table>
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th class="right">Kilos</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map(r=>`
                  <tr>
                    <td>${r.fecha}</td>
                    <td class="right">${to2(r.kilos)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>

            <div class="clientTotal">
              TOTAL: ${to2(total)} kg
            </div>
          </div>
        `;
      }).join("");
  }

  function descargarCSV(){
    if(!REPORTE.length){
      alert("Primero genera un reporte");
      return;
    }

    const head = ["Nombre","Fecha","Kilos"];

    const rows = REPORTE.map(r=>[
      r.nombre,
      r.fecha,
      to2(r.kilos)
    ]);

    const csv = [head, ...rows]
      .map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(","))
      .join("\n");

    const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = `reporte_clientes_${$("#fechaDesde").value}_a_${$("#fechaHasta").value}.csv`;
    a.click();

    URL.revokeObjectURL(url);
  }

  document.querySelectorAll(".tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));

      btn.classList.add("active");
      $("#tab-" + btn.dataset.tab).classList.add("active");
    });
  });

  $("#btnGenerar").addEventListener("click", generarReporte);
  $("#btnCSV").addEventListener("click", descargarCSV);
  $("#clienteFiltro").addEventListener("change", renderFiltrado);

  window.addEventListener("load", async ()=>{
    $("#fechaDesde").value = monthStartISO();
    $("#fechaHasta").value = todayISO();
    await cargarProductos();
  });
</script>

</body>
</html>

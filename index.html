<style>

:root{

*{

body{

  background:var(--bg);

header{

label{

input,

button{

button:hover{

.btn-primary{

.btn-ghost{

.tabs{

.tab{

.section{

}

.section.active{

table{

  margin-top:10px;

th{
  background:#0a7a3b;
  color:#fff;
  padding:10px;
  text-align:left;
  font-size:12px;
  font-weight:800;
  letter-spacing:.5px;
}

td{
  border-bottom:1px solid var(--line);
  padding:10px;
  font-size:13px;
  font-weight:600;
}

tbody tr:nth-child(even){

}

.right{
  text-align:right;
}

.pill{
  display:inline-block;
  padding:7px 14px;
  border-radius:999px;
  background:#eef7f0;
  color:var(--brand);
  font-weight:900;
  font-size:13px;
}

.filterGrid{
  display:grid;
  grid-template-columns:1fr 320px;
  gap:14px;
  margin-bottom:16px;
}

.totalBox{
  background:#eef7f0;
  border:1px solid #cde7d4;
  border-radius:16px;
  padding:16px;
}

.totalBox span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:6px;
  font-weight:700;

  letter-spacing:.5px;
}

.totalBox b{
  font-size:28px;

  font-weight:900;

.cardsGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;

.clientCard{
  border:1px solid var(--line);

  overflow:hidden;

.clientTitle{

  color:#fff;

.clientTotal{
  background:#eef7f0;
  color:#0a7a3b;

  font-weight:900;

.loading{

@media(max-width:900px){

let REPORTE = [];

const $ = s => document.querySelector(s);

function to2(n){
  return Number(n || 0).toFixed(2);
}

function todayISO(){

  const d = new Date();
  const z = d.getTimezoneOffset() * 60000;

  return new Date(d-z)
    .toISOString()
    .slice(0,10);

}

function monthStartISO(){

  const d = new Date();
  const z = d.getTimezoneOffset() * 60000;

  const m = new Date(
    d.getFullYear(),
    d.getMonth(),
    1
  );

  return new Date(m-z)
    .toISOString()
    .slice(0,10);

}

function productoBonito(s){

  const limpio = String(s || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g," ");

  if(!limpio) return "";

  return limpio.charAt(0).toUpperCase() +
         limpio.slice(1);

}

function normalizeKey(s){

  return String(s || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ");

}

async function cargarProductos(){

  const { data, error } = await sb
    .from("productos")
    .select("nombre")
    .order("nombre");

  if(error){
    console.error(error);
    return;
  }

  const select = $("#productoSelect");

  (data || []).forEach(p=>{

    const opt = document.createElement("option");

    opt.value = p.nombre;
    opt.textContent = productoBonito(p.nombre);

    select.appendChild(opt);

  });

}

async function generarReporte(){

  const desde = $("#fechaDesde").value;
  const hasta = $("#fechaHasta").value;
  const producto = $("#productoSelect").value;

  if(!desde || !hasta){
    alert("Selecciona fechas");
    return;
  }

  $("#loading").classList.add("on");

  try{

    const { data:notas, error:notasError } = await sb
      .from("notas_credito")
      .select(`
        id,
        fecha,
        clientes(nombre)
      `)
      .gte("fecha", desde)
      .lte("fecha", hasta);

    if(notasError) throw notasError;

    const ids = (notas || []).map(n=>n.id);

    if(!ids.length){
      alert("No hay notas");
      return;
    }

    let query = sb
      .from("notas_detalle")
      .select(`
        nota_id,
        producto,
        cantidad
      `)
      .in("nota_id", ids);

    if(producto){
      query = query.eq("producto", producto);
    }

    const {
      data:detalles,
      error:detError
    } = await query;

    if(detError) throw detError;

    const mapa = new Map();

    (detalles || []).forEach(d=>{

      const nota =
        notas.find(n=>n.id === d.nota_id);

      if(!nota) return;

      const nombre =
        productoBonito(
          nota.clientes?.nombre ||
          "Sin cliente"
        );

      // IGNORAR VENTA BODEGA
      if(
        normalizeKey(nombre) ===
        normalizeKey("Venta Bodega")
      ){
        return;
      }

      const fecha = nota.fecha;

      const kilos =
        Number(d.cantidad || 0);

      const key =
        `${normalizeKey(nombre)}|${fecha}`;

      if(!mapa.has(key)){

        mapa.set(key,{
          nombre,
          fecha,
          kilos:0
        });

      }

      mapa.get(key).kilos += kilos;

    });

    REPORTE = Array
      .from(mapa.values())
      .map(r=>({
        nombre:r.nombre,
        fecha:r.fecha,
        kilos:Number(to2(r.kilos))
      }))
      .sort((a,b)=> b.kilos - a.kilos);

    renderAll();

  }catch(err){

    console.error(err);
    alert("Error generando reporte");

  }finally{

    $("#loading").classList.remove("on");

  }

}

function renderAll(){

  renderGeneral();
  renderClientesSelect();
  renderFiltrado();
  renderCards();

}

function renderGeneral(){

  const totalKg = REPORTE
    .reduce((a,b)=>
      a + Number(b.kilos || 0)
    ,0);

  $("#generalInfo").textContent =
    `Registros: ${REPORTE.length} · Total: ${to2(totalKg)} kg`;

  $("#generalBody").innerHTML =
    REPORTE.map(r=>`

      <tr>
        <td>${r.nombre}</td>
        <td>${r.fecha}</td>
        <td class="right">${to2(r.kilos)}</td>
      </tr>

    `).join("");

}

function renderClientesSelect(){

  const clientes =
    [...new Set(
      REPORTE.map(r=>r.nombre)
    )]
    .sort((a,b)=>
      a.localeCompare(b,"es")
    );

  $("#clienteFiltro").innerHTML =
    `<option value="">Selecciona cliente</option>` +
    clientes.map(c=>`
      <option value="${c}">
        ${c}
      </option>
    `).join("");

}

function renderFiltrado(){

  const cliente =
    $("#clienteFiltro").value;

  const rows = cliente
    ? REPORTE.filter(r=>r.nombre === cliente)
    : [];

  const total = rows
    .reduce((a,b)=>
      a + Number(b.kilos || 0)
    ,0);

  $("#totalFiltrado").textContent =
    `${to2(total)} kg`;

  $("#filtradoBody").innerHTML =
    rows.map(r=>`

      <tr>
        <td>${r.nombre}</td>
        <td>${r.fecha}</td>
        <td class="right">${to2(r.kilos)}</td>
      </tr>

    `).join("");

}

function renderCards(){

  const grupos = {};

  REPORTE.forEach(r=>{

    if(!grupos[r.nombre]){
      grupos[r.nombre] = [];
    }

    grupos[r.nombre].push(r);

  });

  $("#clientesCards").innerHTML =
    Object.entries(grupos)
    .sort((a,b)=>{

      const totalA =
        a[1].reduce((x,y)=>
          x + Number(y.kilos || 0)
        ,0);

      const totalB =
        b[1].reduce((x,y)=>
          x + Number(y.kilos || 0)
        ,0);

      return totalB - totalA;

    })
    .map(([cliente, rows])=>{

      const total = rows
        .reduce((a,b)=>
          a + Number(b.kilos || 0)
        ,0);

      return `

      <div class="clientCard">

        <div class="clientTitle">
          ${cliente}
        </div>

        <table>

          <thead>
            <tr>
              <th>Fecha</th>
              <th class="right">Kilos</th>
            </tr>
          </thead>

          <tbody>

            ${rows
              .sort((a,b)=> b.kilos - a.kilos)
              .map(r=>`

                <tr>
                  <td>${r.fecha}</td>
                  <td class="right">
                    ${to2(r.kilos)}
                  </td>
                </tr>

              `).join("")}

          </tbody>

        </table>

        <div class="clientTotal">
          TOTAL: ${to2(total)} kg
        </div>

      </div>

      `;

    }).join("");

}

  const totalKg = REPORTE

      a + Number(b.kilos || 0)
    ,0);
